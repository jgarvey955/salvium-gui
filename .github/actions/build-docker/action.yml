name: Build cached dependency image
description: Build a local Docker image using the current GitHub Actions cache API
inputs:
  dockerfile:
    description: Dockerfile to build
    required: true
  image:
    description: Local image tag
    required: true
  cache-scope:
    description: Cache namespace for this dependency image
    required: true
  threads:
    description: Build parallelism (defaults to the runner CPU count)
    default: ''
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - name: Set build parallelism
      id: parallelism
      shell: bash
      env:
        BUILD_THREADS: ${{ inputs.threads }}
      run: echo "threads=${BUILD_THREADS:-$(nproc)}" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.image }}
        load: true
        push: false
        build-args: THREADS=${{ steps.parallelism.outputs.threads }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }},ignore-error=true
