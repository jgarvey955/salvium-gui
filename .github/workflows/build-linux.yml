name: Build Linux (Manual)

on:
  workflow_dispatch:

env:
  FREE_DISKSPACE: |
    sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
    sudo rm -rf /usr/share/dotnet 2>/dev/null || true
    sudo rm -rf /usr/share/swift 2>/dev/null || true
    sudo rm -rf /usr/share/miniconda 2>/dev/null || true

jobs:
  build-linux-static:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: satackey/action-docker-layer-caching@v0.0.11
      if: "!startsWith(github.ref, 'refs/tags/v')"
      continue-on-error: true
      with:
        key: docker-linux-static-{hash}
        restore-keys: |
          docker-linux-static-


    - name: free up diskspace
      run: ${{env.FREE_DISKSPACE}}

    - name: prepare build environment
      run: docker build --tag salvium:build-env-linux --build-arg THREADS=3 --file Dockerfile.linux .

    - name: build
      run: docker run --rm -v ${{ github.workspace }}:/salvium-gui -w /salvium-gui salvium:build-env-linux sh -c 'make release-static -j3'

    - name: sha256sum
      run: shasum -a256 ${{ github.workspace }}/build/release/bin/salvium-wallet-gui

    - name: test qml
      run: sh .github/test-qml-linux.sh

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ github.job }}
        path: |
          ${{ github.workspace }}/build/release/bin/salvium-wallet-gui
          ${{ github.workspace }}/build/release/bin/salviumd
