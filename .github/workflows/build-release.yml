name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag name to create (e.g., v1.0.1)'
        required: false
      publish_release:
        description: 'Publish the release after the build (disable for CI verification)'
        type: boolean
        default: true
      release_notes:
        description: 'Release notes or description (supports Markdown)'
        required: false
        default: 'New release'

env:
  FREE_DISKSPACE: |
    sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
    sudo rm -rf /usr/share/dotnet 2>/dev/null || true
    sudo rm -rf /usr/share/swift 2>/dev/null || true
    sudo rm -rf /usr/share/miniconda 2>/dev/null || true

jobs:

  verify-release-tag:
    name: Verify release tag matches source
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release tag
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-macos-app:
    name: 1. Build GUI App and Pinned Daemon
    runs-on: macos-15
    needs: verify-release-tag
    env:
      QT_TAG: v5.15.17-lts-lgpl
      QT_PREFIX: ${{ github.workspace }}/qt-install

    steps:
      - name: Free up disk space
        run: ${{ env.FREE_DISKSPACE }}

      - name: Check out code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install GUI build dependencies (Homebrew)
        run: |
          brew install boost openssl@3 libsodium pkg-config cmake zeromq \
                       hidapi libpgm miniupnpc expat libunwind-headers protobuf ccache unbound libgcrypt libgpg-error gettext

      - name: Build static HIDAPI
        run: sh .github/build-hidapi-macos.sh

      # Bump the cache version when changing the Qt configure flags or tools.
      - name: Restore static Qt toolchain
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: qt5-static-macos-15-${{ runner.arch }}-${{ env.QT_TAG }}-v1

      - name: Clone qt repo
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: git clone -b "${{ env.QT_TAG }}" --recursive --depth 1 --shallow-submodules https://github.com/qt/qt5

      - name: Build qt from source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          cd qt5
          mkdir build && cd build
          ../configure -prefix "${{ env.QT_PREFIX }}" -opensource -confirm-license -release -static -no-framework -no-feature-qml-worker-script -nomake examples -nomake tests -no-rpath \
                       -skip qtwebengine -skip qt3d -skip qtandroidextras -skip qtcanvas3d -skip qtcharts -skip qtconnectivity \
                       -skip qtdatavis3d -skip qtdoc -skip qtgamepad -skip qtlocation -skip qtnetworkauth -skip qtpurchasing \
                       -skip qtscript -skip qtscxml -skip qtsensors -skip qtserialbus -skip qtserialport -skip qtspeech \
                       -skip qttools -skip qtvirtualkeyboard -skip qtwayland -skip qtwebchannel -skip qtwebsockets \
                       -skip qtwebview -skip qtwinextras -skip qtx11extras -skip gamepad -skip serialbus -skip location -skip webengine
          make -j"$(sysctl -n hw.ncpu)"
          make install

          cd ../qttools/src/linguist/lrelease
          ../../../../build/qtbase/bin/qmake
          make -j"$(sysctl -n hw.ncpu)"
          make install

          cd ../../../../qttools/src/macdeployqt/macdeployqt/
          ../../../../build/qtbase/bin/qmake
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Cache static Qt toolchain
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_PREFIX }}
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Set up GUI build environment paths
        run: |
          echo "CMAKE_PREFIX_PATH=${{ env.QT_PREFIX }}:/opt/homebrew/opt/openssl@3:/opt/homebrew/opt/boost:/opt/homebrew/opt/libsodium:/opt/homebrew/opt/miniupnpc:/opt/homebrew/opt/protobuf:/opt/homebrew/opt/unbound:/opt/homebrew/opt/libgcrypt:/opt/homebrew/opt/libgpg-error:/opt/homebrew/opt/gettext:/opt/homebrew/opt/hidapi:/opt/homebrew/opt/zeromq" >> $GITHUB_ENV
          echo "${{ env.QT_PREFIX }}/bin" >> $GITHUB_PATH

      - name: Configure CMake (GUI)
        run: |
          mkdir -p build/release
          cd build/release
          /opt/homebrew/bin/cmake -D CMAKE_BUILD_TYPE=Release \
                -D BUILD_TESTS=OFF \
                -D STATIC=ON \
                -D USE_DEVICE_TREZOR_MANDATORY=ON \
                -D DEV_MODE=OFF \
                -D MANUAL_SUBMODULES=OFF \
                -D CMAKE_POLICY_DEFAULT_CMP0074=NEW \
                -D Boost_ROOT=/opt/homebrew/opt/boost \
                -D Boost_INCLUDE_DIR=/opt/homebrew/opt/boost/include \
                -D Boost_LIBRARY_DIR=/opt/homebrew/opt/boost/lib \
                -D OPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
                -D OPENSSL_INCLUDE_DIR=/opt/homebrew/opt/openssl@3/include \
                -D OPENSSL_SSL_LIBRARY=/opt/homebrew/opt/openssl@3/lib/libssl.a \
                -D OPENSSL_CRYPTO_LIBRARY=/opt/homebrew/opt/openssl@3/lib/libcrypto.a \
                -D HIDAPI_INCLUDE_DIR="${{ github.workspace }}/hidapi-install/include" \
                -D HIDAPI_LIBRARY="${{ github.workspace }}/hidapi-install/lib/libhidapi.a" \
                -D ZMQ_INCLUDE_PATH=/opt/homebrew/opt/zeromq/include \
                -D ZMQ_LIB=/opt/homebrew/opt/zeromq/lib/libzmq.a \
                -D CMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/opt/openssl@3/lib" \
                -D CMAKE_CXX_FLAGS="-I/opt/homebrew/opt/libsodium/include -I/opt/homebrew/opt/libgpg-error/include -I/opt/homebrew/opt/zeromq/include -I/opt/homebrew/opt/boost/include" \
                ../..
        env:
           CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}

      - name: Build and Deploy (Make)
        run: |
          cd build/release
          make -j$(sysctl -n hw.ncpu)
          make deploy

      - name: Bundle Daemon Built from Pinned Core
        run: |
          EXPECTED_CORE=$(git ls-tree HEAD salvium | awk '{print $3}')
          ACTUAL_CORE=$(git -C salvium rev-parse HEAD)
          test "$EXPECTED_CORE" = "$ACTUAL_CORE"
          test -x build/release/bin/salviumd
          cp build/release/bin/salviumd build/release/bin/salvium-wallet-gui.app/Contents/MacOS/salviumd
          codesign --force --sign - build/release/bin/salvium-wallet-gui.app/Contents/MacOS/salviumd
          codesign --force --deep --sign - build/release/bin/salvium-wallet-gui.app

      - name: Verify bundled macOS libraries
        run: python3 .github/check-macos-bundle.py build/release/bin/salvium-wallet-gui.app

      - name: Test QML
        run: |
          cd build/release/bin
          ./salvium-wallet-gui.app/Contents/MacOS/salvium-wallet-gui --test-qml

      - name: Archive macOS app bundle
        run: tar -czf macos-app-bundle.tar.gz -C build/release/bin salvium-wallet-gui.app

      - name: Upload GUI App Artifact (for next job)
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-bundle-local
          path: macos-app-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1

  bundle-macos-release:
    name: 2. Create Final macOS DMG
    runs-on: macos-15
    needs: build-macos-app

    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-app-bundle-local
          path: ./macos-artifact

      - name: Extract macOS app bundle
        run: tar -xzf macos-artifact/macos-app-bundle.tar.gz

      - name: Ensure GUI Executable has Execute Permissions
        run: |
          chmod +x ./salvium-wallet-gui.app/Contents/MacOS/salvium-wallet-gui
          chmod +x ./salvium-wallet-gui.app/Contents/MacOS/salviumd

      - name: Create unsigned .dmg
        run: |
          hdiutil create -fs HFS+ -srcfolder ./salvium-wallet-gui.app -volname "salvium-gui" salvium-gui-unsigned.dmg

      - name: Upload Final DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-macos-dmg
          path: salvium-gui-unsigned.dmg
          retention-days: 1

  build-windows:
    runs-on: ubuntu-24.04
    needs: verify-release-tag
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build Docker Image for Windows Env
        uses: ./.github/actions/build-docker
        with:
          dockerfile: Dockerfile.windows
          image: salvium:build-env-windows
          cache-scope: gui-deps-windows
      - name: Compile Salvium GUI (Windows Target)
        run: |
          docker run --rm --user $(id -u):$(id -g) \
          -v "${{ github.workspace }}":/salvium-gui \
          -w /salvium-gui salvium:build-env-windows \
          sh -c 'USE_DEVICE_TREZOR_MANDATORY=ON make depends root=/depends target=x86_64-w64-mingw32 tag=win-x64 -j$(nproc)'

      - name: Locate Windows build outputs
        run: |
          BIN_DIR=$(find build/x86_64-w64-mingw32/release/bin -type d | head -n 1)
          if [ -z "$BIN_DIR" ] || [ ! -d "$BIN_DIR" ]; then
            echo "Windows bin directory not found!"
            exit 1
          fi
          if [ ! -f "$BIN_DIR/salvium-wallet-gui.exe" ]; then
            echo "salvium-wallet-gui.exe not found in $BIN_DIR"
            exit 1
          fi
          echo "BIN_DIR_PATH=$BIN_DIR" >> $GITHUB_ENV

      - name: Create ZIP archive
        run: |
          cd "${{ env.BIN_DIR_PATH }}"
          if [ -f salviumd.exe ]; then
            zip salvium-gui-windows-x64.zip salvium-wallet-gui.exe salviumd.exe
          else
            zip salvium-gui-windows-x64.zip salvium-wallet-gui.exe
          fi
          echo "ZIP_PATH=${{ env.BIN_DIR_PATH }}/salvium-gui-windows-x64.zip" >> $GITHUB_ENV

      - name: Upload Artifact (Zipped Windows Build)
        uses: actions/upload-artifact@v4
        with:
          name: salvium-gui-windows-x64-zip
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error # Fail the job if the zip wasn't created

  docker-linux-static:
    runs-on: ubuntu-24.04
    needs: verify-release-tag
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: install packaging tools
      run: sudo apt update && sudo apt -y install zip
    - name: free up diskspace
      run: ${{env.FREE_DISKSPACE}}
    - name: prepare build environment (Docker)
      uses: ./.github/actions/build-docker
      with:
        dockerfile: Dockerfile.linux
        image: salvium:build-env-linux
        cache-scope: gui-deps-linux
    - name: build (inside Docker)
      run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e USE_DEVICE_TREZOR_MANDATORY=ON -v "${{ github.workspace }}:/salvium-gui" -w /salvium-gui salvium:build-env-linux sh -c 'make release-static -j$(nproc)'
    - name: Locate Linux build outputs
      run: |
        BIN_DIR=${{ github.workspace }}/build/release/bin
        if [ ! -d "$BIN_DIR" ]; then
          echo "Linux bin directory not found!"
          exit 1
        fi
        echo "BIN_DIR_PATH=$BIN_DIR" >> $GITHUB_ENV
    - name: test qml
      run: sh .github/test-qml-linux.sh

    - name: Create ZIP archive
      run: |
        cd "${{ env.BIN_DIR_PATH }}"
        zip salvium-gui-linux-x64-static.zip salvium-wallet-gui salviumd
        echo "ZIP_PATH=${{ env.BIN_DIR_PATH }}/salvium-gui-linux-x64-static.zip" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v4
      with:
        name: salvium-gui-linux-x64-static-zip
        path: ${{ env.ZIP_PATH }}

  # --- Android job completely removed ---

  create-release:
    if: inputs.publish_release
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - bundle-macos-release
      - build-windows
      - docker-linux-static
      - verify-release-tag
      # - docker-android # Removed from needs

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifact structure
        run: ls -R ./artifacts

      - name: Find artifact paths
        id: find_files
        run: |
          echo "macos_dmg_path=$(find ./artifacts/final-macos-dmg -name '*.dmg' | head -n 1)" >> $GITHUB_OUTPUT
          echo "windows_zip_path=$(find ./artifacts/salvium-gui-windows-x64-zip -name '*.zip' | head -n 1)" >> $GITHUB_OUTPUT
          echo "linux_zip_path=$(find ./artifacts/salvium-gui-linux-x64-static-zip -name '*.zip' | head -n 1)" >> $GITHUB_OUTPUT
          # apk_path removed

      - name: Create Release Notes File
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: echo "$RELEASE_NOTES" > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          target_commitish: ${{ needs.verify-release-tag.outputs.commit }}
          name: Release ${{ github.event.inputs.tag_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.find_files.outputs.macos_dmg_path }}
            ${{ steps.find_files.outputs.windows_zip_path }}
            ${{ steps.find_files.outputs.linux_zip_path }}
