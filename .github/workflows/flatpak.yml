name: Flatpak

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-5.15-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set package version and release date
        env:
          PACKAGE_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('share/io.salvium.Salvium.metainfo.xml')
          tree = ET.parse(path)
          release = tree.find('releases/release')
          release.set('version', os.environ['PACKAGE_VERSION'].removeprefix('v'))
          release.set('date', datetime.date.today().isoformat())
          tree.write(path, encoding='UTF-8', xml_declaration=True)
          PY

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        env:
          FLATPAK_BUILDER_N_JOBS: 3
        with:
          manifest-path: share/io.salvium.Salvium.yaml
          arch: ${{ matrix.arch }}
          bundle: salvium-${{ matrix.arch }}.flatpak
          artifact-name: salvium-flatpak-${{ matrix.arch }}
          cache: true

      - name: Validate installed metadata
        run: appstreamcli validate --no-net flatpak_app/files/share/metainfo/io.salvium.Salvium.metainfo.xml

      - name: Print binary hashes
        working-directory: flatpak_app/files/bin
        run: sha256sum salvium-wallet-gui salvium-wallet-cli salvium-wallet-rpc salviumd >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to Flathub Beta
        if: github.event_name == 'release' && github.repository == 'salvium/salvium-gui'
        uses: flatpak/flatpak-github-actions/flat-manager@v6
        with:
          flat-manager-url: https://hub.flathub.org
          repository: beta
          token: ${{ secrets.FLATHUB_ }}
